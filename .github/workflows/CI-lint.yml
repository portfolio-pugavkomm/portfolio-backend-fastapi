name: "Lint"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync

      - name: Run mypy
        run: uv run mypy src/



